<div class="rating">
  <div class="average">
    <span class="score">★ {{ average().toFixed(1) }}</span>
    <span class="label">promedio</span>
  </div>

  @if (authService.isAuthenticated()) {
    <div class="my-rating">
      <span class="label">{{ myRating() ? 'Tu calificación:' : 'Califica este artículo:' }}</span>
      <div class="stars">
        @for (star of stars; track star) {
          <button
            type="button"
            class="star"
            [class.filled]="myRating() !== null && star <= myRating()!"
            [disabled]="isSaving()"
            [attr.aria-label]="star + ' estrellas'"
            (click)="rate(star)"
          >★</button>
        }
      </div>
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
  } @else {
    <p class="login-hint"><a routerLink="/login">Inicia sesión</a> para calificar.</p>
  }
</div>
