server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes de artículos llegan hasta 5MB. El límite por defecto de nginx es
    # 1MB y las rechazaría con un 413 antes de que la petición alcance al backend.
    client_max_body_size 6M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre (main-A1B2C3.js) nunca cambian de contenido:
    # cachearlos para siempre es seguro y evita descargas repetidas.
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: es el único archivo con nombre fijo, y es quien
    # apunta a los bundles nuevos. Si se cachea, el usuario sigue cargando la
    # versión vieja de la app después de un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # El build de producción llama a /api/v1 (ruta relativa). nginx reenvía esas
    # peticiones al contenedor del backend, que en la red de Docker se llama 'api'.
    # Como navegador y API comparten origen, CORS deja de intervenir por completo.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Las imágenes subidas las sirve el backend desde /uploads/**
    #
    # El ^~ es imprescindible: nginx evalúa los location con expresión regular ANTES
    # que los de prefijo, así que sin él una ruta como /uploads/articles/1/foto.png
    # caería en el bloque de caché de estáticos (~* \.(png|...)$), que la buscaría en
    # el disco de nginx y devolvería 404. Con ^~, al coincidir este prefijo nginx deja
    # de evaluar las expresiones regulares.
    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Enrutamiento del lado del cliente: Angular maneja /articulos/mi-slug en el
    # navegador, pero nginx no tiene ese archivo. Sin este try_files, recargar la
    # página en cualquier ruta que no sea "/" devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
